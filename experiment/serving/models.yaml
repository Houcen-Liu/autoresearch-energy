# Pinned proposer subjects.
#
# FAIRNESS RULE (D3): both arms must use the SAME quantizer, the SAME serving
# stack and the SAME max-model-len. An AWQ and a GPTQ build of the same weights
# are not the same subject. Prefer a matched pair from one publisher.
#
# Candidate matched pairs (verified to exist; pick ONE row and pin the revision):
#
#   publisher   dense                              moe
#   ---------   --------------------------------   ---------------------------------
#   cyankiwi    cyankiwi/Qwen3.6-27B-AWQ-INT4      cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit
#   QuantTrio   QuantTrio/Qwen3.6-27B-AWQ          QuantTrio/Qwen3.6-35B-A3B-AWQ
#
# Get the exact revision before downloading, and record it here:
#   huggingface-cli download <repo> --revision main --quiet 2>/dev/null
#   python -c "from huggingface_hub import HfApi; \
#              print(HfApi().model_info('<repo>').sha)"
#
# NOT usable on RTX 4000 Ada (sm_89):
#   *-NVFP4        NVFP4 needs Blackwell (sm_100+)
#   Qwen/*-FP8     ~28 GB of weights, exceeds 20 GB
#   *-21.2GB       exceeds the card outright

dense:
  base_repo: Qwen/Qwen3-14B
  quant_repo: Qwen/Qwen3-14B-AWQ
  revision: 31c69efc29464b6bb0aee1398b5a7b50a99340c3
  quantizer: awq
  approx_weights_gb: 10.0

moe:
  base_repo: Qwen/Qwen3-30B-A3B
  quant_repo: QuixiAI/Qwen3-30B-A3B-AWQ
  revision: 1ba5586ace54cc9de85addac384eb88576f94598
  quantizer: awq
  approx_weights_gb: 16.8


# Pre-registered backup if G1 fails on the MoE. Loses the sparse-vs-dense
# contrast and becomes a size contrast -- supervisor's call, made before G1.
backup_dense:
  base_repo: ibm-granite/granite-4.1-8b-instruct
backup_large:
  base_repo: ibm-granite/granite-4.1-30b-instruct
